name: Релиз

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, v0.2.1-ru.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Сборка установщика
    runs-on: windows-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Установить Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Кэш зависимостей Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установить Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Поставить зависимости фронтенда
        run: bun install --frozen-lockfile

      - name: Собрать установщик
        run: bun run tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  create-release:
    name: Опубликовать релиз
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Подготовить файлы релиза и контрольные суммы
        run: |
          mkdir -p release-assets
          cp artifacts/windows-installer/*.exe release-assets/
          cd release-assets
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: opcode RU ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## opcode с русским интерфейсом — ${{ steps.version.outputs.version }}

            Сборка под Windows x64. Интерфейс приложения и установщик на русском языке;
            английский можно вернуть в «Настройки → Общие → Язык интерфейса».

            ### Установка

            Скачайте `.exe` ниже и запустите. Установщик работает без прав администратора
            и ставит программу в профиль текущего пользователя.

            Проверить целостность файла можно по приложенной сумме `.sha256`.

            ### Что нужно для работы

            Установленный [Claude Code](https://claude.com/claude-code) — opcode это
            графическая оболочка к нему, а не замена.
