name: Сборка Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Выложить установщик в артефакты сборки'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Установщик NSIS (x64)
    runs-on: windows-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Установить Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Кэш зависимостей Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установить Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Поставить зависимости фронтенда
        run: bun install --frozen-lockfile

      - name: Проверить типы
        run: bunx tsc --noEmit

      # tauri build сам вызывает `bun run build` (beforeBuildCommand),
      # так что фронтенд собирается здесь же.
      - name: Собрать установщик
        run: bun run tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Показать, что собралось
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis/

      - name: Выложить установщик
        uses: actions/upload-artifact@v4
        with:
          name: opcode-ru-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
